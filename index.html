<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Emergencia</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #202124;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

.header {
    background: #c62828;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-radius: 18px 18px 0 0;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 7px 0 0;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 0 0 18px 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.item {
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.label {
    font-size: 14px;
    color: #666;
    font-weight: bold;
    margin-bottom: 5px;
}

.value {
    font-size: 19px;
}

.warning {
    background: #fff3e0;
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
}

.call {
    display: block;
    margin-top: 22px;
    background: #16833c;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 18px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🆘 FICHA DE EMERGENCIA</h1>
        <p>Información importante</p>
    </div>

    <div class="card">

        <div class="item">
            <div class="label">👤 NOMBRE</div>
            <div class="value">Aura Moreno López</div>
        </div>

        <div class="item">
            <div class="label">🎂 FECHA DE NACIMIENTO</div>
            <div class="value">24/02/2024</div>
        </div>

        <div class="item">
            <div class="label">🩸 GRUPO SANGUÍNEO</div>
            <div class="value">B+</div>
        </div>

        <div class="warning">
            <div class="label">⚠️ ALERGIAS / MEDICACIÓN / INFORMACIÓN IMPORTANTE</div>
            <div class="value">Sin alergias conocidas</div>
        </div>

        <div class="item">
            <div class="label">📞 CONTACTO DE EMERGENCIA</div>
            <div class="value">Aurora</div>
        </div>

        <a class="call" href="tel:+34635057147">
            📞 LLAMAR AL CONTACTO
        </a>

    </div>

    <div class="footer">
        Ficha de emergencia · AURUM 3D LAB
    </div>

</div>

</body>
</html>
